
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBLX Top Donasi Saver</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10131d;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#8c7cff}
.card{
 background:#1c2130;padding:18px;
 border-radius:15px;margin:15px 0;
}
input{
 width:100%;padding:13px;margin:6px 0;
 border:0;border-radius:8px;
 background:#30384c;color:white;
}
button{
 padding:11px;border:0;border-radius:8px;
 background:#7765ff;color:white;
 font-weight:bold;margin:4px;cursor:pointer;
}
.delete{background:#e44c64}
.export{background:#159b75}
.player{
 background:#30384c;padding:13px;
 border-radius:10px;margin:8px 0;
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;
}
.rank{color:#b5aaff;font-weight:bold}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="container">

<h1>🎮 RBLX DATA SAVER</h1>
<p style="text-align:center;color:#aaa">
TOP DONASI DATABASE
</p>

<div class="card">
<h3>➕ Tambah Pemain</h3>
<input id="name" placeholder="Nama pemain Roblox">
<input id="amount" type="number" placeholder="Jumlah donasi">
<button onclick="addPlayer()">SIMPAN DATA</button>
</div>

<div class="card">
<h3>🏆 TOP DONASI</h3>
<div id="players"></div>
<p class="small" id="total"></p>
</div>

<div class="card">
<h3>💾 Backup Database</h3>
<button class="export" onclick="backup()">EXPORT JSON</button>
<button onclick="document.getElementById('file').click()">IMPORT JSON</button>
<input type="file" id="file" accept=".json"
style="display:none" onchange="restore(event)">
<p class="small">
Data disimpan otomatis di browser ini.
Simpan file backup agar tidak hilang jika data browser terhapus.
</p>
</div>

</div>

<script>
let players = JSON.parse(
 localStorage.getItem("rblx_players") || "[]"
);

function save(){
 localStorage.setItem(
  "rblx_players",JSON.stringify(players)
 );
 render();
}

function addPlayer(){
 let name=document.getElementById("name").value.trim();
 let amount=Number(document.getElementById("amount").value);

 if(!name || !Number.isFinite(amount) || amount<=0){
  alert("Masukkan nama dan jumlah donasi!");
  return;
 }

 players.push({
  id:Date.now()+Math.random(),
  name:name,
  amount:amount
 });

 document.getElementById("name").value="";
 document.getElementById("amount").value="";
 save();
}

function editPlayer(id){
 let p=players.find(x=>x.id===id);
 if(!p)return;
 let name=prompt("Nama pemain:",p.name);
 if(name===null)return;
 let amount=prompt("Jumlah donasi:",p.amount);
 if(amount===null)return;
 if(!name.trim() || !Number.isFinite(Number(amount)) || Number(amount)<=0){
  alert("Data tidak valid!");
  return;
 }
 p.name=name.trim();
 p.amount=Number(amount);
 save();
}

function deletePlayer(id){
 if(!confirm("Hapus data pemain ini?"))return;
 players=players.filter(x=>x.id!==id);
 save();
}

function render(){
 let box=document.getElementById("players");
 let sorted=[...players].sort((a,b)=>b.amount-a.amount);

 box.innerHTML="";

 sorted.forEach((p,i)=>{
  let div=document.createElement("div");
  div.className="player";

  let info=document.createElement("div");
  let rank=document.createElement("span");
  rank.className="rank";
  rank.textContent="#"+(i+1)+" ";

  let name=document.createElement("b");
  name.textContent=p.name;

  let amount=document.createElement("div");
  amount.className="small";
  amount.textContent="R$ "+p.amount.toLocaleString("id-ID");

  info.append(rank,name,amount);

  let actions=document.createElement("div");

  let edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editPlayer(p.id);

  let del=document.createElement("button");
  del.textContent="X";
  del.className="delete";
  del.onclick=()=>deletePlayer(p.id);

  actions.append(edit,del);
  div.append(info,actions);
  box.append(div);
 });

 document.getElementById("total").textContent=
 "Total pemain tersimpan: "+players.length;
}

function backup(){
 let blob=new Blob(
  [JSON.stringify(players,null,2)],
  {type:"application/json"}
 );
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="rblx-backup.json";
 a.click();
 URL.revokeObjectURL(a.href);
}

function restore(event){
 let file=event.target.files[0];
 if(!file)return;

 let reader=new FileReader();
 reader.onload=()=>{
  try{
   let data=JSON.parse(reader.result);
   if(!Array.isArray(data) ||
      !data.every(p=>
       typeof p.name==="string" &&
       Number.isFinite(p.amount) &&
       p.amount>0
      )){
    throw Error();
   }
   players=data.map(p=>({
    id:Date.now()+Math.random(),
    name:p.name,
    amount:p.amount
   }));
   save();
   alert("Database berhasil dipulihkan!");
  }catch(e){
   alert("File backup tidak valid!");
  }
  event.target.value="";
 };
 reader.readAsText(file);
}

render();
</script>
</body>
</html>
