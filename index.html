
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBLX Finder</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090914;color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:30px 15px;
 background:linear-gradient(135deg,#251344,#111020);
}
header h1{color:#b99aff;margin:0}
header p{color:#aaa;font-size:12px}
main{max-width:550px;margin:auto;padding:20px}
.card{
 background:#191629;padding:18px;
 border:1px solid #44336d;
 border-radius:17px;margin-bottom:15px;
}
input{
 width:100%;padding:15px;
 border-radius:10px;border:1px solid #6148a0;
 background:#0c0c18;color:white;font-size:15px;
}
button{
 width:100%;padding:14px;margin-top:10px;
 background:#875cf5;color:white;
 border:0;border-radius:10px;font-weight:bold;
}
#status{text-align:center;color:#aaa;padding:15px}
.profile{display:none;text-align:center}
.avatar{
 width:125px;height:125px;
 border-radius:20px;border:3px solid #a98aff;
}
.info{
 background:#29243d;padding:13px;
 border-radius:9px;margin:8px 0;
 display:flex;justify-content:space-between;
 gap:10px;
}
.info span{color:#b99aff}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.secondary{background:#38334b}
</style>
</head>
<body>

<header>
<h1>✦ RBLX FINDER</h1>
<p>ROBLOX PLAYER SEARCH SYSTEM</p>
</header>

<main>
<div class="card">
<h3>🔎 Cari Player Roblox</h3>
<input id="username" placeholder="Masukkan username...">
<button id="btn" onclick="searchPlayer()">SEARCH PLAYER</button>
</div>

<div id="status">Masukkan username Roblox.</div>

<div class="card profile" id="profile">
<img id="avatar" class="avatar">
<h2 id="name"></h2>
<p id="display" style="color:#b99aff"></p>

<div class="info"><span>USER ID</span><b id="uid"></b></div>
<div class="info"><span>CREATED</span><b id="created"></b></div>
<div class="info"><span>STATUS</span><b id="accountStatus"></b></div>

<div class="actions">
<button onclick="copyID()">COPY ID</button>
<button class="secondary" onclick="openProfile()">PROFILE ↗</button>
</div>
</div>
</main>

<script>
let player=null;

async function searchPlayer(){
 const username=document.getElementById('username').value.trim();
 const status=document.getElementById('status');
 const btn=document.getElementById('btn');

 if(!username){
  status.textContent='Masukkan username!';
  return;
 }

 document.getElementById('profile').style.display='none';
 btn.disabled=true;
 status.textContent='⏳ Mencari pemain...';

 try{
  const r=await fetch(
   'https://users.roblox.com/v1/users/search?keyword='+
   encodeURIComponent(username)+'&limit=10'
  );
  if(!r.ok)throw Error();
  const data=await r.json();

  if(!data.data?.length){
   status.textContent='Player tidak ditemukan!';
   return;
  }

  const p=data.data.find(
   x=>x.name.toLowerCase()===username.toLowerCase()
  )||data.data[0];

  const d=await fetch('https://users.roblox.com/v1/users/'+p.id);
  if(!d.ok)throw Error();
  player=await d.json();

  const t=await fetch(
   'https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+
   player.id+'&size=150x150&format=Png'
  );
  if(!t.ok)throw Error();
  const thumb=await t.json();

  document.getElementById('avatar').src=
   thumb.data?.[0]?.imageUrl||'';
  document.getElementById('name').textContent=player.name;
  document.getElementById('display').textContent=
   '@'+player.displayName;
  document.getElementById('uid').textContent=player.id;
  document.getElementById('created').textContent=
   new Date(player.created).toLocaleDateString('id-ID');
  document.getElementById('accountStatus').textContent=
   player.isBanned?'Banned':'Active';

  document.getElementById('profile').style.display='block';
  status.textContent='✅ Player ditemukan!';
 }catch(e){
  status.textContent='Gagal mencari. Periksa internet atau coba lagi.';
 }finally{
  btn.disabled=false;
 }
}

function copyID(){
 if(!player)return;
 navigator.clipboard.writeText(String(player.id))
 .then(()=>alert('ID berhasil disalin!'))
 .catch(()=>alert('Gagal menyalin ID.'));
}

function openProfile(){
 if(player){
  window.open(
   'https://www.roblox.com/users/'+player.id+'/profile',
   '_blank'
  );
 }
}

document.getElementById('username').addEventListener(
 'keydown',e=>{if(e.key==='Enter')searchPlayer()}
);
</script>
</body>
</html>
