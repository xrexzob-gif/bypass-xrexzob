<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>ZOB MP3 DOWNLOADER</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#173c55 0%,#0b1727 42%,#070b13 100%);font-family:Arial,sans-serif;color:#f4f8ff}
main{width:min(100%,460px)}.head{text-align:center;margin-bottom:25px}
.logo{width:68px;height:68px;margin:0 auto 15px;border-radius:22px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#28ddc2,#397bff);box-shadow:0 10px 35px #1ecdbd44}
h1{font-size:23px;letter-spacing:1.4px;margin:0}.head p{color:#91a8bd;font-size:13px;margin:9px 0}
.panel{padding:23px;border:1px solid #263c50;background:#101c2b;border-radius:22px;box-shadow:0 24px 70px #0007}
label{display:block;font-size:13px;color:#b7c8d8;margin:0 0 10px}
input{width:100%;padding:16px 14px;border:1px solid #30485e;border-radius:12px;background:#091321;color:white;font-size:14px;outline:none}
input:focus{border-color:#35cfc1;box-shadow:0 0 0 3px #35cfc122}
button{width:100%;border:0;border-radius:12px;padding:16px;margin-top:14px;background:linear-gradient(90deg,#24cdb8,#3988ff);font-weight:800;font-size:15px;color:#06131d;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.status{min-height:22px;margin-top:15px;font-size:13px;color:#9db1c4;line-height:1.5}
.download{display:none;text-decoration:none;text-align:center;padding:15px;border:1px solid #286e70;background:#102e35;color:#6df0d8;border-radius:12px;margin-top:12px;font-weight:bold}
.foot{text-align:center;color:#71879b;font-size:11px;line-height:1.6;margin:17px 8px 0}
</style>
</head>
<body>
<main>
 <header class="head">
  <div class="logo">♫</div>
  <h1>ZOB MP3 DOWNLOADER</h1>
  <p>Tempel link • Convert • Download</p>
 </header>
 <section class="panel">
  <label for="url">LINK AUDIO / VIDEO</label>
  <input id="url" type="url" placeholder="Tempel link di sini..." autocomplete="off">
  <button id="convert">CONVERT MP3</button>
  <div class="status" id="status">Tempel tautan sumber yang mengizinkan pengunduhan.</div>
  <a class="download" id="download" href="#" download>⬇ DOWNLOAD MP3</a>
 </section>
 <p class="foot">Antarmuka siap dihubungkan ke backend. Konversi URL membutuhkan server yang mendukung sumber tersebut dan memiliki izin untuk mengunduh/mengonversi audionya.</p>
</main>
<script>
const input=document.getElementById('url');
const button=document.getElementById('convert');
const statusBox=document.getElementById('status');
const downloadLink=document.getElementById('download');

/* Setelah backend tersedia, ganti URL di bawah dengan alamat backend.
   Backend menerima POST JSON: { "url": "..." }
   Backend mengembalikan JSON: { "downloadUrl": "https://..." }
*/
const BACKEND_URL = "https://GANTI-DENGAN-URL-BACKEND-KAMU/api/convert";

button.addEventListener('click', async () => {
 const value=input.value.trim();
 downloadLink.style.display='none';
 if(!value){statusBox.textContent='Tempel link terlebih dahulu.';input.focus();return;}
 try{new URL(value);}catch{statusBox.textContent='Format link tidak valid.';return;}
 if(BACKEND_URL.includes('GANTI-DENGAN-URL-BACKEND-KAMU')){
   statusBox.textContent='HTML sudah siap. Backend belum dipasang — nanti isi URL backend di kode ini.';
   return;
 }
 button.disabled=true;button.textContent='MEMPROSES...';statusBox.textContent='Sedang memproses link...';
 try{
  const response=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:value})});
  if(!response.ok)throw new Error('Server mengembalikan error ('+response.status+').');
  const result=await response.json();
  if(!result.downloadUrl)throw new Error('Link hasil download tidak ditemukan.');
  downloadLink.href=result.downloadUrl;downloadLink.style.display='block';
  downloadLink.textContent='⬇ DOWNLOAD MP3';
  statusBox.textContent='Selesai! Tekan tombol download.';
 }catch(error){statusBox.textContent='Gagal: '+error.message;}
 finally{button.disabled=false;button.textContent='CONVERT MP3';}
});
</script>
</body>
</html>
