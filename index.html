
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RBLX Finder</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090914;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:28px;text-align:center;
 background:linear-gradient(135deg,#302052,#111020);
}
header h1{color:#b99aff;margin:0}
header p{color:#aaa;font-size:12px}
main{max-width:550px;margin:auto;padding:18px}
.card{
 background:#191629;padding:18px;
 border:1px solid #493875;border-radius:16px;
 margin-bottom:15px;
}
input{
 width:100%;padding:14px;margin:7px 0;
 border:1px solid #59458a;border-radius:10px;
 background:#0e0d1b;color:white;font-size:15px;
}
button{
 padding:13px;border:0;border-radius:9px;
 background:#855cf5;color:white;font-weight:bold;
 cursor:pointer;
}
.searchbtn{width:100%;margin-top:10px}
#status{text-align:center;color:#aaa;padding:12px}
.result{
 background:#29243e;padding:12px;
 border-radius:12px;margin:10px 0;
 display:flex;align-items:center;gap:12px;
 cursor:pointer;
}
.result img{
 width:65px;height:65px;border-radius:12px;
}
.result small{display:block;color:#aaa;margin-top:5px}
.profile{text-align:center;display:none}
.avatar{
 width:130px;height:130px;object-fit:cover;
 border:3px solid #a98aff;border-radius:22px;
}
.info{
 display:flex;justify-content:space-between;
 gap:10px;background:#29243e;padding:13px;
 border-radius:9px;margin:8px 0;
}
.info span{color:#b99aff}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.secondary{background:#39334e}
</style>
</head>
<body>

<header>
<h1>✦ RBLX FINDER</h1>
<p>ROBLOX PLAYER SEARCH SYSTEM</p>
</header>

<main>
<div class="card">
<h3>🔎 Find Player</h3>
<input id="query" placeholder="Username atau User ID Roblox">
<button class="searchbtn" id="btn" onclick="search()">SEARCH PLAYER</button>
</div>

<div id="status">Masukkan username atau User ID.</div>
<div id="results"></div>

<div class="card profile" id="profile">
<img id="avatar" class="avatar">
<h2 id="name"></h2>
<p id="display" style="color:#b99aff"></p>
<div class="info"><span>USER ID</span><b id="uid"></b></div>
<div class="info"><span>CREATED</span><b id="created"></b></div>
<div class="info"><span>STATUS</span><b id="accountStatus"></b></div>
<div class="actions">
<button onclick="copyID()">COPY ID</button>
<button class="secondary" onclick="openProfile()">PROFILE ↗</button>
</div>
</div>
</main>

<script>
let currentPlayer=null;

async function api(url){
 const r=await fetch(url);
 if(!r.ok)throw Error('HTTP '+r.status);
 return r.json();
}

async function search(){
 const q=document.getElementById('query').value.trim();
 const status=document.getElementById('status');
 const results=document.getElementById('results');
 const profile=document.getElementById('profile');
 const btn=document.getElementById('btn');

 if(!q){status.textContent='Masukkan username atau ID!';return;}

 btn.disabled=true;
 results.innerHTML='';
 profile.style.display='none';
 status.textContent='⏳ Sedang mencari...';

 try{
  let users=[];

  if(/^\d+$/.test(q)){
   const p=await api('https://users.roblox.com/v1/users/'+q);
   users=[p];
  }else{
   const data=await api(
    'https://users.roblox.com/v1/users/search?keyword='+
    encodeURIComponent(q)+'&limit=10'
   );
   users=data.data||[];
  }

  if(!users.length){
   status.textContent='❌ Pemain tidak ditemukan.';
   return;
  }

  status.textContent='Ditemukan '+users.length+' pemain.';

  users.forEach(p=>{
   const div=document.createElement('div');
   div.className='result';

   const img=document.createElement('img');
   img.alt='Avatar';
   img.src='https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+
    p.id+'&size=150x150&format=Png&isCircular=false';

   // Thumbnail endpoint mengembalikan JSON, ambil URL gambarnya.
   loadAvatar(p.id,img);

   const info=document.createElement('div');
   const b=document.createElement('b');
   b.textContent=p.displayName||p.name;
   const small=document.createElement('small');
   small.textContent='@'+p.name+' • ID: '+p.id;
   info.append(b,small);
   div.append(img,info);
   div.onclick=()=>details(p.id);
   results.append(div);
  });

 }catch(e){
  status.textContent='Gagal: '+e.message;
 }finally{
  btn.disabled=false;
 }
}

async function loadAvatar(id,img){
 try{
  const d=await api(
   'https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+
   id+'&size=150x150&format=Png&isCircular=false'
  );
  img.src=d.data?.[0]?.imageUrl||'';
 }catch(e){}
}

async function details(id){
 const status=document.getElementById('status');
 status.textContent='⏳ Mengambil profil...';

 try{
  const p=await api('https://users.roblox.com/v1/users/'+id);
  currentPlayer=p;

  const thumb=await api(
   'https://thumbnails.roblox.com/v1/users/avatar?userIds='+
   id+'&size=420x420&format=Png&isCircular=false'
  );

  document.getElementById('avatar').src=
   thumb.data?.[0]?.imageUrl||'';
  document.getElementById('name').textContent=p.name;
  document.getElementById('display').textContent='@'+p.displayName;
  document.getElementById('uid').textContent=p.id;
  document.getElementById('created').textContent=
   new Date(p.created).toLocaleDateString('id-ID');
  document.getElementById('accountStatus').textContent=
   p.isBanned?'Banned':'Active';

  document.getElementById('profile').style.display='block';
  status.textContent='✅ Profil ditemukan!';
 }catch(e){
  status.textContent='Gagal mengambil detail profil.';
 }
}

function copyID(){
 if(currentPlayer){
  navigator.clipboard.writeText(String(currentPlayer.id))
  .then(()=>alert('User ID disalin!'))
  .catch(()=>alert('Gagal menyalin ID.'));
 }
}

function openProfile(){
 if(currentPlayer){
  window.open('https://www.roblox.com/users/'+
   currentPlayer.id+'/profile','_blank');
 }
}

document.getElementById('query').addEventListener(
 'keydown',e=>{if(e.key==='Enter')search()}
);
</script>
</body>
</html>
