
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FILEHUB - File Sharing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#eef3ff;font-family:Arial,sans-serif}
header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24314a}
.logo{font-size:24px;font-weight:bold;letter-spacing:2px}
.logo span{color:#5795ff}
.status{color:#5ce0a0;font-size:12px}
main{max-width:1100px;margin:40px auto;padding:0 18px}
h1{font-size:42px;margin-bottom:8px}
p{color:#91a2bd}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#111a2b;border:1px solid #293954;border-radius:18px;padding:22px}
.card h2{margin-top:0}
.upload{border:2px dashed #49658d;border-radius:15px;padding:35px 15px;text-align:center;background:#152238}
button,.pick{background:#5795ff;color:white;border:0;padding:12px 17px;border-radius:10px;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:13px;border:1px solid #344563;border-radius:10px;background:#0a1424;color:white;margin:8px 0}
input[type=file]{display:none}
.file{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #293954}
.fileinfo{flex:1;min-width:0;overflow-wrap:anywhere}
.file a{color:#79aaff;text-decoration:none}
.message{background:#1b2940;border-radius:12px;padding:12px;margin:12px 0;overflow-wrap:anywhere}
.copy{padding:7px 12px;margin-top:8px;background:#304667}
.preview{max-width:100%;max-height:220px;border-radius:10px;margin-top:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:32px}main{margin:25px auto}header{padding:18px}}
</style>
</head>
<body>
<header>
 <div class="logo">FILE<span>HUB</span></div>
 <div class="status">● ONLINE</div>
</header>

<main>
 <h1>Share Anything.</h1>
 <p>Tempat berbagi foto, musik, video, dokumen, dan kode.</p>

 <div class="grid">
  <section class="card">
   <h2>☁️ Upload File</h2>
   <div class="upload">
    <div style="font-size:40px">📁</div>
    <p>Pilih file yang ingin dibagikan</p>
    <label class="pick" for="picker">Pilih File</label>
    <input type="file" id="picker" multiple>
   </div>
   <h3>File tersedia</h3>
   <div id="files">Belum ada file.</div>
  </section>

  <section class="card">
   <h2>💬 Pesan & Kode</h2>
   <input id="sender" placeholder="Nama pengirim">
   <textarea id="message" rows="6" placeholder="Tulis pesan atau tempel kode di sini..."></textarea>
   <button onclick="sendMessage()">Kirim Pesan</button>
   <h3>Pesan terbaru</h3>
   <div id="messages">Belum ada pesan.</div>
  </section>
 </div>
</main>

<script>
const picker=document.getElementById('picker');
const files=document.getElementById('files');
const messages=document.getElementById('messages');

let uploaded=[];

picker.onchange=()=>{
 [...picker.files].forEach(file=>{
  const url=URL.createObjectURL(file);
  uploaded.push({file,url});
 });
 renderFiles();
 picker.value='';
};

function renderFiles(){
 files.innerHTML='';
 uploaded.forEach(item=>{
  const f=item.file;
  const div=document.createElement('div');
  div.className='file';

  const info=document.createElement('div');
  info.className='fileinfo';
  info.innerHTML='<b></b><br><small style="color:#91a2bd"></small>';
  info.querySelector('b').textContent=f.name;
  info.querySelector('small').textContent=(f.size/1024/1024).toFixed(2)+' MB';

  const link=document.createElement('a');
  link.href=item.url;
  link.download=f.name;
  link.textContent='⬇ Download';

  div.append(info,link);

  if(f.type.startsWith('image/')){
   const img=document.createElement('img');
   img.src=item.url;
   img.className='preview';
   div.append(img);
  }

  if(f.type.startsWith('audio/')){
   const audio=document.createElement('audio');
   audio.src=item.url;
   audio.controls=true;
   audio.style.width='100%';
   div.append(audio);
  }

  if(f.type.startsWith('video/')){
   const video=document.createElement('video');
   video.src=item.url;
   video.controls=true;
   video.className='preview';
   div.append(video);
  }

  files.append(div);
 });
}

function sendMessage(){
 const text=document.getElementById('message').value.trim();
 const name=document.getElementById('sender').value.trim()||'Pengunjung';
 if(!text)return;

 const box=document.createElement('div');
 box.className='message';

 const title=document.createElement('b');
 title.textContent=name;

 const content=document.createElement('pre');
 content.textContent=text;
 content.style.whiteSpace='pre-wrap';
 content.style.overflowWrap='anywhere';

 const copy=document.createElement('button');
 copy.className='copy';
 copy.textContent='Salin Pesan';
 copy.onclick=async()=>{
  await navigator.clipboard.writeText(text);
  copy.textContent='Tersalin ✓';
 };

 box.append(title,content,copy);
 messages.prepend(box);
 document.getElementById('message').value='';
}
</script>
</body>
</html>
